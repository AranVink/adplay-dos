name: AdPlay for DOS CI/CD

on:
  - push
  - pull_request

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        gcc_compiler: [12.2.0]

      fail-fast: false

    runs-on: ${{matrix.os}}

    steps:
        - name: Checkout AdPlug
          uses: actions/checkout@v4
          with:
            repository: 'adplug/adplug'
            ref: 'db2cb13954adf124eed768ef62c8ba7d926f0d39' # Target this commit, this contains patches for Adplug to provide DJGPP/Adplay DOS compatibility. Leave as is until new version is released
            path: adplug
        - name: Checkout libbinio
          uses: actions/checkout@v4
          with:
            repository: 'adplug/libbinio'
            path: libbinio
        - name: Checkout gcctimer
          uses: actions/checkout@v4
          with:
            repository: 'adplug/gcctimer'
            path: gcctimer
        - name: Checkout AdPlay for DOS (this repository)
          uses: actions/checkout@v4
          with:
            path: adplay
        - name: Checkout DosBox-X
          uses: actions/checkout@v4
          with:
            repository: AranVink/dosbox-x
            ref: 'abd5f29d8fa2b406ed8d3cc71746dbada83ae8a9' # Specific commit with adds /O to DX-CAPTURE, allowing for DRO capture from the command-line
            path: dosbox-x
        - name: Checkout SDL
          uses: actions/checkout@v4
          with:
            repository: libsdl-org/SDL
            ref: 'release-2.28.5' # We need a newer version (SDL2 >= 2.0.12) that support SDL_VIDEO_OFFSCREEN, which Ubuntu's SDL2 package does not have (yet).
            path: sdl
    
        - name: Install packages (Linux)
          if: ${{ runner.os == 'Linux' }}
          run: |
            sudo apt update
            sudo apt install -y texlive-latex-base texinfo libfl2 libfl-dev bison flex curl make texinfo zlib1g-dev unzip wget bzip2 zip git bash automake libtool pkg-config upx
            # Flex is required, but even though it's in the GitHub runner image, and marked as installed
            # it's still missing some things, see https://github.com/orgs/community/discussions/45029
   
            if [[ ${{ matrix.gcc_compiler }} == "12.2.0" ]]; then
              wget https://github.com/andrewwutw/build-djgpp/releases/download/v3.4/djgpp-linux64-gcc1220.tar.bz2
              bzcat djgpp-linux64-gcc1220.tar.bz2 | sudo tar -x --directory /usr/local
            else
              echo 'Unsupported version of GCC/DJGPP'
              exit 1
            fi
   
        - name: Set DJGPP environment
          run: |
            echo 'compile_opts=--host=i586-pc-msdosdjgpp --prefix=/usr/local/djgpp PKG_CONFIG_PATH=/usr/local/djgpp/lib/pkgconfig' >> $GITHUB_ENV
            echo '/usr/local/djgpp/bin/' >> $GITHUB_PATH
    
        - name: Install libbinio
          run: |
            pushd libbinio && autoreconf -i && ./configure --enable-maintainer-mode ${{ env.compile_opts }} && make && sudo env PATH="$PATH" make install && popd
    
        - name: Install gcctimer
          run: |
            source /usr/local/djgpp/setenv
            pushd gcctimer
            make CC=gcc prefix=/usr/local/djgpp RANLIB=ranlib
            sudo env PATH="$PATH" make CC=gcc prefix=/usr/local/djgpp install
            popd

        - name: make AdPlug
          run: |
            ulimit -c unlimited -S
            pushd adplug
            autoreconf -i
            ./configure ${{ env.compile_opts }}  || cat config.log
            sudo env PATH="$PATH" make install
            popd

        - name: Build window library
          run: |
            pushd adplay/window
            source /usr/local/djgpp/setenv
            make RANLIB=ranlib
            sudo env PATH="$PATH" make install
            popd

        - name: Build AdPlay for DOS
          run: |
            source /usr/local/djgpp/setenv
            pushd adplay
            make gcc_version=${{ matrix.gcc_compiler }} binarydist
            popd
        - name: Build SDL2
          run: |
            pushd sdl
            ./configure --enable-video-offscreen
            make
            sudo make install
            popd
        - name: Build dosbox-x
          run: |
            pushd dosbox-x
            sudo apt install -y automake gcc g++ make libncurses-dev nasm libpcap-dev libslirp-dev fluidsynth libfluidsynth-dev libavdevice58 libavformat-dev libavcodec-dev libavcodec-extra libavcodec-extra58 libswscale-dev libfreetype-dev libxkbfile-dev libxrandr-dev
            ./build-sdl2
            sudo make install
            popd
        - name: Test AdPlay for DOS
          run: |
            set -x
            set +e
            pushd adplay
            mkdir capture
            dosbox-x --version
            export SDL_VIDEODRIVER=offscreen
            export SDL_AUDIODRIVER=dummy
            dosbox-x --fastlaunch --nomenu --time-limit 10 --exit -c "mount c ." -c "c:" -c "cls" -c "dx-capture /v /a /o adplay"
            dosbox-x --fastlaunch --nomenu --time-limit 10 --exit -c "mount c ." -c "c:" -c "cls" -c "dx-capture /v /a /o adplay /?"
            cp -v ../adplug/test/testmus/* .
            dosbox-x --fastlaunch --nomenu --time-limit 600 --exit -c "mount c ." -c "c:" -c "cls" -c "dx-capture /v /a /o adplay -q loudness.lds"
            ls -al ./capture
            # Assert Adplay is printed in output of txt.out
            # Assert audio is hearable
            # Assert dro file matches known good dro file
            # Seperate video file
            popd
        - name: Upload artifact
          uses: actions/upload-artifact@v3
          with:
            name: adplay
            path: |
              adplay/*.zip
              adplay/capture/*.dro
              adplay/capture/*.wav
              adplay/capture/*.avi
